[package]
name = "omd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
glob-match = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
tempfile = "3"
